[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "write", path = "./artifacts" }]
extra_output = ["storageLayout"]
gas_reports = ["Multisig", "MultisigSetup", "ListedCheckCondition"]

[fuzz]
runs = 256

[fmt]
# src/ keeps the formatting of the audited code (prettier-solidity); forge fmt cannot reproduce it
ignore = ["src/**/*.sol"]
